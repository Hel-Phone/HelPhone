# Render Blueprint for HelPhone Services & Automated Soroban State Exporter
services:
  - type: web
    name: helphone-backend-server
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm run server
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SOROBAN_RPC_URL
        value: "https://soroban-testnet.stellar.org"
      - key: CONTRACT_ID
        value: "CC325F37QW7N2F5M3QGHL4A4O7J2K9L0M1N2O3P4Q5R6S7T8U9V0"
      - key: ALLOWED_ORIGINS
        value: "https://helphone.com,https://staging.helphone.com,http://localhost:3000"

  - type: cron
    name: soroban-daily-state-exporter
    runtime: node
    schedule: "0 0 * * *"
    buildCommand: npm install
    startCommand: bash scripts/export-contract-state.sh
    envVars:
      - key: SOROBAN_RPC_URL
        value: "https://soroban-testnet.stellar.org"
      - key: CONTRACT_ID
        value: "CC325F37QW7N2F5M3QGHL4A4O7J2K9L0M1N2O3P4Q5R6S7T8U9V0"
