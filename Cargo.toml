[workspace]
resolver = "2"
members = ["contracts/aegis_vault", "contracts/helphone_dao"]
# Standalone crates that keep their own lockfiles / workspaces.
exclude = ["contract", "contracts/emergency_vault", "contracts/maintainer_vault"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true
